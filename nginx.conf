# 本地开发服务器 (HTTP)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    # 设置根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # 允许上传大文件（备份包可能很大）
    client_max_body_size 500M;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # API 反向代理
    location /api {
        proxy_pass http://backend:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Public 资源
    location /articles {
        expires 1h;
        add_header Cache-Control "public";
    }

    location /picture {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /friend_avatar {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /emoji {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|md)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# 生产环境 HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    server_name quininezzzz.top www.quininezzzz.top;
    
    # 强制重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# 生产环境 HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name quininezzzz.top www.quininezzzz.top;
    
    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/quininezzzz.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/quininezzzz.top.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 设置根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # 允许上传大文件（备份包可能很大）
    client_max_body_size 500M;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # API 反向代理
    location /api {
        # 代理到后端容器（保留完整路径）
        proxy_pass http://backend:3002;
        
        # 设置代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Public 资源（文章、图片等）- 直接提供静态文件
    location /articles {
        expires 1h;
        add_header Cache-Control "public";
    }

    location /picture {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /friend_avatar {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 表情包资源
    location /emoji {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|md)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 404 /index.html;
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
