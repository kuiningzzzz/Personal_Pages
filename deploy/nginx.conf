map $http_upgrade $pages_connection { default upgrade; '' close; }
server {
    listen 80;
    listen [::]:80;
    server_name quininezzzz.top;
    return 301 https://quininezzzz.top$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quininezzzz.top;
    ssl_certificate /etc/nginx/ssl/quinine-personal/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/quinine-personal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/personal-pages;
    index index.html;
    client_max_body_size 2G;
    client_body_timeout 600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(?:server|data|backups|activities/dev|activities/release)(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    location = /music-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /favicon.png { proxy_pass http://127.0.0.1:3002; }
    # Multipart framing needs a little more space than the 16 GiB file limit.
    location = /api/admin/backups/restore {
        client_max_body_size 17G;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        access_log off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pages_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        access_log off;
    }
    location ~ ^/(picture|source|emoji|friend_avatar|articles)/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location ~* \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
